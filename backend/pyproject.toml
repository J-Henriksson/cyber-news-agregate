[project]
name = "cyber-news-agregate"
version = "0.1.0"
description = "Cybersecurity news, leaks, flaws and tools compiled into incidents, scored for relevance, shown as graphs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "feedparser>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
